[package]
name = "kratt-v2"
version = "0.1.0"
edition = "2024"
default-run = "kratt-v2"

[dependencies]
crossterm = "0.29.0"
dotenvy = "0.15.7"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = "0.4.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
toon = "0.1"
turso = { version = "0.7.0", features = ["fts", "sync"] }
